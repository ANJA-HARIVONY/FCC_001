# FCC_001 — Nginx de la bascule. Le HTML React est servi ici.
# /api va vers le conteneur api. Les uploads et les avatars sont les volumes Flask.

server {
    listen 80;
    server_name _;
    client_max_body_size 16m;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        root /data;
        try_files $uri @instance_uploads;
    }

    location @instance_uploads {
        rewrite ^/uploads/(.*)$ /instance/uploads/$1 break;
        root /data;
    }

    location /static/avatars/ {
        alias /data/avatars/;
    }

    location /static/ {
        try_files $uri =404;
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
