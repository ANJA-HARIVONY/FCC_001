{# Carte mobile de una línea de material (detalle de salida).
   Variables : linea (requis) #}
<article class="mobile-list-card">
    <div class="mobile-list-card__head">
        <div class="mobile-list-card__meta">
            <span class="badge bg-secondary">×{{ linea.cantidad }}</span>
        </div>
    </div>
    <span class="mobile-list-card__title">{{ linea.material.nombre if linea.material else '—' }}</span>
    {% if linea.material and linea.material.modelo %}
    <p class="mobile-list-card__subtitle">{{ linea.material.modelo }}</p>
    {% endif %}
</article>
