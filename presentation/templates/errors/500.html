<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Error del servidor — CONNEXIA</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="error-standalone-page d-flex align-items-center min-vh-100">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="text-center error-standalone-brand mb-3">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="CONNEXIA" class="error-standalone-logo mb-2">
                    <p class="mb-0">Registro de Atención al cliente</p>
                </div>
                <div class="card error-standalone-card border-0 shadow text-center">
                    <div class="card-body p-4 p-md-5">
                        <div class="error-page-code text-danger">500</div>
                        <h1 class="h4 mb-2">Error interno del servidor</h1>
                        <p class="text-muted mb-4">
                            Se ha producido un error inesperado.
                            El equipo técnico ha sido notificado. Inténtelo de nuevo en unos minutos.
                        </p>
                        <div class="d-flex flex-wrap gap-2 justify-content-center">
                            <button type="button" class="btn btn-outline-secondary" onclick="location.reload()">
                                <i class="fas fa-sync-alt me-1"></i>Recargar
                            </button>
                            <a href="{{ url_for('dashboard') }}" class="btn btn-danger">
                                <i class="fas fa-home me-1"></i>Volver al inicio
                            </a>
                        </div>
                    </div>
                </div>
                <p class="text-center error-standalone-footer mt-3 mb-0">&copy; 2026 CONNEXIA</p>
            </div>
        </div>
    </div>
</body>
</html>
